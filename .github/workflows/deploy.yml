name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # V1.24.0 — garde-fous avant toute build de production: la suite de résilience, le check de
      # déterminisme strict (deux processus indépendants, même seed) et le snapshot doré. N'importe
      # lequel de ces 3 échoue -> le job s'arrête ici (comportement par défaut de GitHub Actions sur un
      # `run` en échec), `build` (upload-pages-artifact) et `deploy` (needs: build) ne s'exécutent
      # jamais. Reproduit en CI exactement le protocole déjà suivi manuellement avant chaque push.
      - run: npm test
      - run: node tests/determinism-check.mjs
      - run: npm run snapshot:verify
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
